<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NBG Studio – D.J.Radio Mix</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #263238, #080808 65%);
      font-family: Arial, sans-serif;
      color: white;
    }

    .radio {
      width: 350px;
      padding: 45px 30px;
      text-align: center;
      border-radius: 30px;
      background: rgba(20,20,20,.95);
      box-shadow:
        0 0 50px rgba(0,0,0,.8),
        0 0 30px rgba(0,180,255,.15);
    }

    .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 25px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #00bcd4, #1565c0);
      box-shadow: 0 0 35px rgba(0,188,212,.45);
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-top: 8px;
      color: #aaa;
      font-size: 15px;
    }

    .play {
      margin-top: 35px;
      width: 190px;
      height: 65px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(135deg, #00bcd4, #1976d2);
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,150,255,.3);
      transition: .2s;
    }

    .play:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 35px rgba(0,200,255,.5);
    }

    .status {
      margin-top: 22px;
      color: #777;
      font-size: 14px;
    }

    .live {
      color: #00e676;
    }
  </style>
</head>

<body>

  <div class="radio">

    <div class="logo">NBG</div>

    <h1>NBG Studio</h1>

    <div class="subtitle">
       Radio • Music • Live
    </div>

    <audio id="radio">
      <source
        src="http://icy1.mpbnl.nl/starfm.mp3"
        type="audio/mpeg">
    </audio>

    <button class="play" id="playButton" onclick="toggleRadio()">
       PLAY
    </button>

    <div class="status" id="status">
      Радиото е спряно
    </div>

  </div>

  <script>
    const radio = document.getElementById("radio");
    const button = document.getElementById("playButton");
    const status = document.getElementById("status");

    function toggleRadio() {

      if (radio.paused) {

        radio.play()
          .then(() => {
            button.innerHTML = " PAUSE";
            status.innerHTML = " NBG Studio – Live D.J.Radio Mix";
            status.className = "status live";
          })
          .catch(() => {
            status.innerHTML =
              " Потокът не може да бъде стартиран.";
          });

      } else {

        radio.pause();

        button.innerHTML = " PLAY";
        status.innerHTML = "Радиото е спряно";
        status.className = "status";
      }
    }
  </script>

</body>
</html>
